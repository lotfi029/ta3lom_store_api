name: deploy

# Runbook: deploy/README.md (edge model, plan §5). Images: ghcr.io/lotfi029/ta3lom-store-api and …-api-migrate
# (private; the VPS pulls with its OWN read:packages token — no registry token is ever sent to the VPS).
# A deploy starts only after CI succeeded on the same commit:
#   CI ok on main (workflow_run)       → images :<sha>, :staging-<sha>  → staging (store-api-staging), smoke /health/ready
#   push of a tag vX.Y.Z (strict)      → the run's ref IS the tag (review 04 H-3: the `production` environment's "v* tags
#                                        only" rule now applies — a workflow_run always ran on main); the gate checks the
#                                        ref is refs/tags/vX.Y.Z, the tagged commit is on main, and waits until every CI
#                                        check run on that commit succeeded → images :<sha>, :X.Y.Z → production after the
#                                        `production` reviewer
#   workflow_dispatch (environment, tag) → rollback to an existing tag, checked against the environment and the label
# Missing SSH secrets → the deploy step is SKIPPED with a warning (the commands are printed), never a failure.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to redeploy
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: Existing image tag (staging-<sha> for staging, X.Y.Z for production)
        type: string
        required: true

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/lotfi029/ta3lom-store-api
  MIGRATE_IMAGE: ghcr.io/lotfi029/ta3lom-store-api-migrate

jobs:
  gate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    outputs:
      target: ${{ steps.decide.outputs.target }}
      sha: ${{ steps.decide.outputs.sha }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Staging — CI must have succeeded on a push to main
        if: github.event_name == 'workflow_run'
        id: staging
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target=none tag=
          # Tags no longer deploy from here (H-3): only main → staging.
          if [ "$CONCLUSION" = success ] && [ "$EVENT" = push ] && [ "$BRANCH" = main ]; then target=staging tag="staging-$SHA"; fi
          case "$SHA" in *[!0-9a-f]*) echo "::error::invalid sha"; exit 1 ;; esac
          { echo "target=$target"; echo "sha=$SHA"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "deploy target: $target ${tag:+($tag)}"
      - name: Production — the ref must be a release tag vX.Y.Z
        if: github.event_name == 'push'
        run: |
          printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::production deploys from refs/tags/vX.Y.Z only (got '$GITHUB_REF')"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Production — the tagged commit is on main, and every CI check run on it succeeded
        if: github.event_name == 'push'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          case "$SHA" in *[!0-9a-f]*) echo "::error::invalid sha"; exit 1 ;; esac
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA (tag ${GITHUB_REF_NAME}) is not on main"; exit 1; }
          # CI runs on the same tag push; wait for its check runs on this commit (the job names of ci.yml).
          for i in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "build-test" or .name == "stack")]')"
            total="$(jq length <<<"$runs")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")"
            echo "CI on $SHA: $total check run(s), $pending running, $failed not successful"
            [ "$failed" -eq 0 ] || { echo "::error::CI did not succeed on $SHA"; exit 1; }
            if [ "$total" -ge 2 ] && [ "$pending" -eq 0 ]; then
              { echo "target=production"; echo "sha=$SHA"; echo "tag=${GITHUB_REF_NAME#v}"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::CI on $SHA did not finish within 45 minutes"; exit 1
      - name: Decide
        id: decide
        env:
          S_TARGET: ${{ steps.staging.outputs.target }}
          S_SHA: ${{ steps.staging.outputs.sha }}
          S_TAG: ${{ steps.staging.outputs.tag }}
          P_TARGET: ${{ steps.production.outputs.target }}
          P_SHA: ${{ steps.production.outputs.sha }}
          P_TAG: ${{ steps.production.outputs.tag }}
        run: |
          if [ -n "$P_TARGET" ]; then target=$P_TARGET sha=$P_SHA tag=$P_TAG; else target=${S_TARGET:-none} sha=$S_SHA tag=$S_TAG; fi
          { echo "target=$target"; echo "sha=$sha"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "deploy target: $target ${tag:+($tag)}"

  images:
    needs: gate
    if: needs.gate.outputs.target != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: images-${{ needs.gate.outputs.target }}
      cancel-in-progress: false
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, self-check, then push (api, migrate)
        run: |
          docker build --target api --build-arg VERSION="$TAG" --build-arg GIT_SHA="$SHA" -t "$API_IMAGE:$TAG" -t "$API_IMAGE:$SHA" .
          docker build --target migrate --build-arg VERSION="$TAG" --build-arg GIT_SHA="$SHA" -t "$MIGRATE_IMAGE:$TAG" -t "$MIGRATE_IMAGE:$SHA" .
          docker run --rm --read-only --tmpfs /tmp "$API_IMAGE:$TAG" self-check
          for image in "$API_IMAGE" "$MIGRATE_IMAGE"; do docker push "$image:$TAG"; docker push "$image:$SHA"; done

  staging:
    needs: [gate, images]
    if: needs.gate.outputs.target == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://store-api-staging.ta3lom.sa/health/ready
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR || '/srv/ta3lom-store/deploy' }}
      HEALTH_URL: https://store-api-staging.ta3lom.sa/health/ready
      ENV_FILE: .env.staging
      PROJECT: ta3lom-store-staging
    steps:
      - &deploy
        name: Deploy over SSH (pull, migrate, up --wait)
        id: deploy
        run: |
          REMOTE="cd '$DEPLOY_DIR' && export STORE_VERSION='$TAG' && docker compose --env-file '$ENV_FILE' -p '$PROJECT' -f compose.yaml pull migrate api && docker compose --env-file '$ENV_FILE' -p '$PROJECT' -f compose.yaml up -d --wait api"
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::warning::SSH secrets for this environment are not set — deploy SKIPPED. Would run on the VPS:"
            echo "  $REMOTE"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "$REMOTE"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - &smoke
        name: Smoke /health/ready
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for i in $(seq 1 20); do curl -fsS --max-time 10 "$HEALTH_URL" && exit 0; sleep 6; done
          echo "::error::$HEALTH_URL did not become ready"; exit 1
      - &cleanup
        name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  production:
    needs: [gate, images]
    if: needs.gate.outputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `production` environment has a required reviewer and only allows v* tags (repository settings).
    environment:
      name: production
      url: https://store-api.ta3lom.sa/health/ready
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR || '/srv/ta3lom-store/deploy' }}
      HEALTH_URL: https://store-api.ta3lom.sa/health/ready
      ENV_FILE: .env.production
      PROJECT: ta3lom-store
    steps:
      - *deploy
      - *smoke
      - *cleanup

  # Run it from the TAG for production ("Use workflow from: <tag>"): the production environment only allows v* refs.
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
      SSH_HOST: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_HOST || secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_USER || secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_KNOWN_HOSTS || secrets.STAGING_SSH_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ inputs.environment == 'production' && (vars.PRODUCTION_DEPLOY_DIR || '/srv/ta3lom-store/deploy') || (vars.STAGING_DEPLOY_DIR || '/srv/ta3lom-store/deploy') }}
      HEALTH_URL: ${{ inputs.environment == 'production' && 'https://store-api.ta3lom.sa/health/ready' || 'https://store-api-staging.ta3lom.sa/health/ready' }}
      ENV_FILE: ${{ inputs.environment == 'production' && '.env.production' || '.env.staging' }}
      PROJECT: ${{ inputs.environment == 'production' && 'ta3lom-store' || 'ta3lom-store-staging' }}
    steps:
      - name: The tag must belong to the environment
        run: |
          case "$TARGET" in
            production) printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::production takes X.Y.Z tags only (got '$TAG')"; exit 1; } ;;
            staging) printf '%s' "$TAG" | grep -Eq '^staging-[0-9a-f]{40}$' || { echo "::error::staging takes staging-<sha> tags only (got '$TAG')"; exit 1; } ;;
            *) echo "::error::unknown environment"; exit 1 ;;
          esac
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image label must carry the same tag (built for this environment)
        run: |
          label="$(docker buildx imagetools inspect "$API_IMAGE:$TAG" --format '{{ json .Image }}' | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')"
          [ "$label" = "$TAG" ] || { echo "::error::$API_IMAGE:$TAG carries version '${label:-none}', not $TAG"; exit 1; }
      - *deploy
      - *smoke
      - *cleanup
