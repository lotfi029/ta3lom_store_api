# S-03a-lite — CI only (no image, no deploy; hosting comes after the build, Cloud-build-plan §5).
# Gates of plan 14 §4.4 that run without a container registry: build, format, tests, vulnerable packages.
name: ci

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Ta3lom.Store.slnx

      - name: Build (warnings as errors)
        run: dotnet build Ta3lom.Store.slnx -warnaserror --no-restore

      - name: Format
        run: dotnet format Ta3lom.Store.slnx --verify-no-changes --no-restore

      # Integration tests use Testcontainers postgres:18 (Docker is available on GitHub runners).
      - name: Test
        run: dotnet test --solution Ta3lom.Store.slnx --no-build

      - name: Vulnerable packages (fail on High/Critical)
        run: |
          dotnet list Ta3lom.Store.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::High or Critical vulnerable package found"; exit 1
          fi
