# Local development database only (the API runs with `dotnet run`). Not a secret: a throw-away local password.
#   docker compose -f compose.dev.yaml up -d --wait
# Same container name and port as the web repo's scripts/api-up.sh, so both start the same database.
name: ta3lom-store-dev

services:
  postgres:
    image: postgres:18
    container_name: t3s-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ta3lom_store_dev
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ta3lom_store_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg-data:
